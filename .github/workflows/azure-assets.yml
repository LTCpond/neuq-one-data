name: Deploy static assets to Azure (test)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: assets-azure-test
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          package-manager-cache: false
      - name: Build static assets and latest release manifest
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/build-assets.mjs .work/assets-public --github-release
      - name: Prepare public assets for Azure
        run: node scripts/prepare-azure-assets.mjs .work/assets-public
      - name: Deploy to the Azure test site
        uses: Azure/static-web-apps-deploy@4d27395796ac319302594769cfe812bd207490b1 # v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          app_location: ".work/assets-public"
          output_location: ""
          api_location: ""
          skip_app_build: true
          action: upload
