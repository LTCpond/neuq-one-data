name: Go CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
      - name: Check gofmt
        run: |
          files="$(gofmt -l cmd internal)"
          if [[ -n "$files" ]]; then
            printf '%s\n' "$files"
            exit 1
          fi
      - run: go vet ./...
      - run: go test ./...
      - run: go test -race ./...
      - run: go build ./...
  assets:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          package-manager-cache: false
      - name: Test static build, release manifest and deployment packages
        run: node --test scripts/test-*.mjs
      - name: Test legacy static asset staging
        run: bash scripts/test-stage-assets.sh
      - name: Check workflow syntax
        run: |
          cd "$RUNNER_TEMP"
          archive=actionlint_1.7.12_linux_amd64.tar.gz
          curl -fsSLO "https://github.com/rhysd/actionlint/releases/download/v1.7.12/$archive"
          printf '%s  %s\n' 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8 "$archive" | sha256sum --check
          tar -xzf "$archive" actionlint
          cd "$GITHUB_WORKSPACE"
          "$RUNNER_TEMP/actionlint"
