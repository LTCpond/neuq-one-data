name: Deploy static assets

on:
  push:
    branches: [main]
    paths:
      - 'assets/**'
      - 'scripts/build-assets.mjs'
      - 'scripts/prepare-azure-assets.mjs'
      - 'scripts/azure-site.mjs'
      - 'internal/exporter/headers.txt'
      - '.github/workflows/assets.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: assets-production
  cancel-in-progress: false

jobs:
  build:
    name: Build static assets
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      revision: ${{ steps.checkout.outputs.commit }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        id: checkout
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          package-manager-cache: false
      - name: Build static assets and latest release manifest
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/build-assets.mjs .work/assets-public --github-release
      - name: Upload public static assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: static-assets-${{ github.run_attempt }}
          path: .work/assets-public/
          if-no-files-found: error
          retention-days: 1

  deploy-cloudflare:
    name: Deploy static assets to Cloudflare Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: static-assets-${{ github.run_attempt }}
          path: .work/assets-public
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install Wrangler
        run: npm install --prefix .work/wrangler --no-save --no-package-lock wrangler@4.168.0
      - name: Deploy static assets to production
        env:
          CLOUDFLARE_ASSETS_PROJECT: ${{ vars.CLOUDFLARE_ASSETS_PROJECT || 'neuq-one-assets' }}
          CLOUDFLARE_DATA_PROJECT: ${{ vars.CLOUDFLARE_PROJECT || 'neuq-one-data' }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: 'false'
        run: |
          if [[ ! "$CLOUDFLARE_ASSETS_PROJECT" =~ ^[a-z0-9]+(-[a-z0-9]+)*$ ]]; then
            echo '静态资源 Pages 项目名称无效'
            exit 1
          fi
          if [[ "$CLOUDFLARE_ASSETS_PROJECT" == "$CLOUDFLARE_DATA_PROJECT" || "$CLOUDFLARE_ASSETS_PROJECT" == neuq-one-data ]]; then
            echo '静态资源需要独立的 Pages 项目'
            exit 1
          fi
          if [[ -z "$CLOUDFLARE_API_TOKEN" || -z "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo '请配置 Cloudflare 部署 Secrets'
            exit 1
          fi
          .work/wrangler/node_modules/.bin/wrangler pages deploy .work/assets-public \
            --project-name "$CLOUDFLARE_ASSETS_PROJECT" --branch main

  deploy-azure:
    name: Deploy static assets to Azure Static Web Apps
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.build.outputs.revision }}
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: static-assets-${{ github.run_attempt }}
          path: .work/assets-public
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          package-manager-cache: false
      - name: Prepare public assets for Azure
        run: node scripts/prepare-azure-assets.mjs .work/assets-public
      - name: Upload static assets to Azure
        uses: Azure/static-web-apps-deploy@4d27395796ac319302594769cfe812bd207490b1 # v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          app_location: ".work/assets-public"
          output_location: ""
          api_location: ""
          skip_app_build: true
          production_branch: main
          action: upload
